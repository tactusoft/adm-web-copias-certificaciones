<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui">
<body>
	<ui:composition
		template="./../../WEB-INF/webparts/notificationmain.xhtml">
		<ui:param name="title" value="Expedición Copias" />
		<ui:define name="mainContent">
			<h:form id="frmInboxSolicitudes">
				<p:poll interval="120"
					listener="#{notificationProcessBean.actualiarInboxTable}"
					update="inboxNotificationtable" />
				<h:panelGroup layout="block" styleClass="col" id="pnlTabla">
					<div class="row">

						<fieldset>
							<legend>Descargar Memorandos</legend>

							<p:dataTable resizableColumns="false"
								emptyMessage="No hay solicitudes pendientes." rowIndexVar="_row"
								paginator="true" rows="5"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
								currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registros"
								rowsPerPageTemplate="5,10,15" id="inboxNotificationtable"
								var="pendingRequests"
								value="#{notificationProcessBean.listaMemorando}">

								<p:column headerText="#" width="3%" class="row-index"
									exportable="false">
									<h:outputText value="#{_row + 1}" />
								</p:column>

								<p:column headerText="Id"
									filterBy="#{pendingRequests.idtramite}"
									filterMatchMode="contains" class="text-center" width="5%">
									<h:outputText value="#{pendingRequests.idtramite}" />
									<p:inputText value="#{pendingRequests.idtramite}"
										id="hiddenfield" type="hidden" />
								</p:column>

								<p:column headerText="Año"
									filterBy="#{pendingRequests.ano_radi}"
									filterMatchMode="contains" class="text-center" width="5%">
									<h:outputText value="#{pendingRequests.ano_radi}" />
								</p:column>

								<p:column filterBy="#{pendingRequests.nume_radi}"
									filterMatchMode="contains" headerText="# Rad."
									class="text-center" width="5%">
									<h:outputText value="#{pendingRequests.stringNume_radi}" />
								</p:column>

								<p:column filterBy="#{pendingRequests.fecha_creacion}"
									sortBy="#{pendingRequests.fecha_creacion}"
									headerText="Fecha Radicación" class="text-center"
									id="fechaCreacion" width="17%">
									<h:outputText value="#{pendingRequests.fecha_creacion}">
										<f:convertDateTime type="localDateTime"
											pattern="yyyy-MM-dd HH:mm" locale="es" />
									</h:outputText>
								</p:column>

								<p:column filterBy="#{pendingRequests.tipoDcoumento}"
									filterMatchMode="contains" headerText="Tipo Documento"
									class="text-center" width="10%">
									<h:outputText value="#{pendingRequests.tipoDcoumento}" />
								</p:column>

								<p:column headerText="# Documento" class="text-center"
									width="10%" filterBy="#{pendingRequests.numeroIdentificacion}"
									sortBy="#{pendingRequests.numeroIdentificacion}"
									id="numeroDocumento">
									<h:outputText value="#{pendingRequests.numeroIdentificacion}">
										<f:convertNumber locale="es" type="number"
											minFractionDigits="0" pattern="##########" />
									</h:outputText>

								</p:column>

								<p:column headerText="Solicitante" class="text-center"
									width="27%" filterMatchMode="contains"
									filterBy="#{pendingRequests.estado.description2}">
									<h:outputText value="#{pendingRequests.nombreSolicitante}" />
								</p:column>

								<p:column headerText="Estado" class="text-center" width="27%"
									filterMatchMode="contains"
									filterBy="#{pendingRequests.nombreSolicitante}">
									<h:outputText value="#{pendingRequests.estado.description2}" />
								</p:column>

								<p:column headerText="Acciones" width="8%"
									class="text-center align-middle">

									<p:commandLink styleClass="btn btn-sm btn-warning btn-block"
										process="@this"
										onclick="PF('dlgProcessing').show();hideProcessing();"
										ajax="false" update="@form"
										actionListener="#{notificationProcessBean.descargarMemo(pendingRequests)}">
										<i class="fas fa-file-download fa-lg fa-fw mr-2"></i>
                                            Descargar
                                        </p:commandLink>

								</p:column>

							</p:dataTable>


						</fieldset>

					</div>
				</h:panelGroup>
			</h:form>
		</ui:define>
	</ui:composition>
</body>
</html>
