<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:c="jakarta.tags.core"
	xmlns:p="http://primefaces.org/ui">
    <body>
        <ui:composition template="./../../WEB-INF/webparts/notificationmain.xhtml">
            <ui:param name="title" value="Expedición Copias" />
            <ui:define name="mainContent">
                <h:form id="frmInboxSolicitudes">
                     <p:poll interval="120" listener="#{notificationProcessBean.actualiarInboxTable}" update="inboxNotificationtable" />
                    <h:panelGroup layout="block"
                                  styleClass="col" id="pnlTabla">
                        <div class="row">

                            <fieldset>
                                <legend>
                                    Reasignar solicitudes
                                </legend>
                                <p:ajaxStatus>
                                    <f:facet name="default">
                                        <div class="row">
                                            <div class="col form-group" align="right">
                                                <p:commandLink
                                                    ajax="true"
                                                    styleClass="btn btn-primary"
                                                    actionListener="#{notificationProcessBean.actualiarInboxTable}"
                                                    title="Actualizar vista" 
                                                    update="inboxNotificationtable">
                                                    <f:param name="validate" value="true"/>
                                                    <i class="fa fa-sync-alt"></i>
                                                    Actualizar
                                                </p:commandLink>
                                            </div>                                        
                                        </div> 
                                    </f:facet>
                                    <f:facet name="start">
                                        <div class='alert alert-warning' align="center">
                                            <div class="spinner-border" role="status">
                                                <span class="sr-only">Actualizando datos...</span>
                                            </div> Actualizando datos...
                                        </div>
                                    </f:facet>
                                    <f:facet name="complete">
                                        <div class="row">
                                            <div class="col form-group" align="right">
                                                <p:commandLink
                                                    ajax="true"
                                                    styleClass="btn btn-primary"
                                                    actionListener="#{notificationProcessBean.actualizarReasignarTable}"
                                                    title="Actualizar vista" 
                                                    update="inboxNotificationtable">
                                                    <f:param name="validate" value="true"/>
                                                    <i class="fa fa-sync-alt"></i>
                                                    Actualizar
                                                </p:commandLink>
                                            </div>                                        
                                        </div> 
                                    </f:facet>
                                </p:ajaxStatus>                                

                                <p:dataTable resizableColumns="false"
                                             
                                             emptyMessage="No hay solicitudes pendientes."
                                             rowIndexVar="_row"
                                             paginator="true"
                                             rows="5"
                                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                             currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registros"
                                             rowsPerPageTemplate="5,10,15"
                                             id="inboxNotificationtable"
                                             var="pendingRequests"                                            
                                             value="#{notificationProcessBean.listaSolicitudesActivas}">



                                    <p:column headerText="#" width="3%"
                                              class="row-index" exportable="false">
                                        <h:outputText value="#{_row + 1}" />
                                    </p:column>

                                    <p:column headerText="Id" 
                                              filterBy="#{pendingRequests.idtramite}" 
                                              filterMatchMode="contains" 
                                              class="text-center" width="5%">
                                        <h:outputText value="#{pendingRequests.idtramite}" />
                                        <p:inputText value="#{pendingRequests.idtramite}" id="hiddenfield" type="hidden" />
                                    </p:column>

                                    <p:column headerText="Año" filterBy="#{pendingRequests.ano_radi}" filterMatchMode="contains" class="text-center" width="5%">
                                        <h:outputText value="#{pendingRequests.ano_radi}" />
                                    </p:column>

                                    <p:column filterBy="#{pendingRequests.nume_radi}" filterMatchMode="contains" headerText="# Rad." class="text-center" width="5%">
                                        <h:outputText value="#{pendingRequests.stringNume_radi}" />
                                    </p:column>

                                    <p:column filterBy="#{pendingRequests.fecha_creacion}"
                                              sortBy="#{pendingRequests.fecha_creacion}"
                                              headerText="Fecha Radicación"
                                              class="text-center" id="fechaCreacion"
                                              width="17%">                                        
                                        <h:outputText value="#{pendingRequests.fecha_creacion}" >
                                            <f:convertDateTime type="localDateTime" pattern="yyyy-MM-dd HH:mm" locale="es" />
                                        </h:outputText>
                                    </p:column>

                                    <p:column headerText="Solicitante" class="text-center" width="27%" filterMatchMode="contains" filterBy="#{pendingRequests.nombreSolicitante}">
                                        <h:outputText value="#{pendingRequests.nombreSolicitante}" />
                                    </p:column>
                                    
                                    <p:column headerText="Funcionario" class="text-center" width="20%" filterMatchMode="contains" filterBy="#{pendingRequests.estado.description2}">
                                        <h:outputText value="#{pendingRequests.nombreFuncionario}" />
                                    </p:column>
                                    
                                    <p:column headerText="Estado" class="text-center" width="27%" filterMatchMode="contains" filterBy="#{pendingRequests.nombreSolicitante}">
                                        <h:outputText value="#{pendingRequests.estado.description2}" />
                                    </p:column>

                                    <p:column headerText="Acciones" width="8%"
                                              class="text-center align-middle">

                                        <p:commandLink ajax="false"
                                                       styleClass="btn btn-outline-primary btn-sm btn-block border-0 no-shadow"
                                                       title="Ver detalle de la solicitud"
                                                       process="@this"
                                                       action="/view/notification/reasignardetalle.xhtml?faces-redirect=true"
                                                       actionListener="#{notificationProcessBean.setTramiteActivo(pendingRequests.idtramite)}">
                                            Detalles 
                                            <f:param name="id" value="#{pendingRequests.idtramite}"/><i class="fa fa-bars"></i>
                                        </p:commandLink>

                                    </p:column>

                                </p:dataTable>


                            </fieldset>

                        </div>
                    </h:panelGroup>
                </h:form>
            </ui:define>
        </ui:composition>
    </body>
</html>
